type="required"
versionRange = "[26.2, 26.3)"
ordering = "NONE"
side = "BOTH"

[[dependencies.agricraft]]
modId = "eclipseui"
type="required"
versionRange = "[${eclipseui_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "agricraft-common.mixins.json"

[[mixins]]
config = "agricraft-neoforge.mixins.json"
requiredMods = ["sodium"]
