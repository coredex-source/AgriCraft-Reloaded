plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	api "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	api "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.1:$resourcefulconfig_version"
	api "com.terraformersmc:modmenu:$modmenu_version"

//	modCompileOnly "mezz.jei:jei-$minecraft_version-fabric-api:$jei_version"
//	modRuntimeOnly "mezz.jei:jei-$minecraft_version-fabric:$jei_version"

	implementation "curse.maven:jade-324717:$jade_fabric_version"
}

loom {
	def aw = file("src/main/resources/agricraft-fabric.accesswidener")
	if (aw.exists()) {
		accessWidenerPath.set(aw)
	}
	runs {
		client {
			client()
			setConfigName('Fabric Client')
			ideConfigGenerated(true)
			runDir('runs/client')
		}
		server {
			server()
			setConfigName('Fabric Server')
			ideConfigGenerated(true)
			runDir('runs/server')
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += project(":neoforge").file("src/generated/resources").absolutePath
			exclude '.cache'
		}
	}
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
	configurations.named("$variant") {
		attributes {
			attribute(loaderAttribute, 'fabric')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named("$variant") {
			attributes {
				attribute(loaderAttribute, 'fabric')
			}
		}
	}
}
